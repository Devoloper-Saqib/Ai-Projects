<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Website Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Let AI Build Your Custom Website</h1>
  <form>
    <div class="glass-container">
      <textarea placeholder="Type your website idea here..." id="input" name="prompt"></textarea>
      <button type="button" id="enhance">Enhance Prompt ✨</button>
      <button type="submit" id="generateForm">Generate</button>
    </div>
  </form>

  <script>
    document.getElementById("generateForm").addEventListener("click", function (e) {
      e.preventDefault();
      const prompt = document.getElementById("input").value.trim();
      if (!prompt) return alert("Please enter a prompt.");
      // Redirect with encoded prompt
      window.location.href = `result.html?prompt=${encodeURIComponent(prompt)}`;
    });
  </script>
  <!-- ✅ Script placed at bottom for DOM readiness -->
  <script src="index.js"></script>
</body>
</html>
